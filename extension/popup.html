<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>离线翻译</title>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">译</span>
      <div>
        <div class="title">离线翻译</div>
        <div class="sub" id="status"><i class="dot"></i><span>检查服务中…</span></div>
      </div>
    </div>
    <select id="target" title="目标语言">
      <option value="zh">中文</option>
      <option value="en">英文</option>
      <option value="ja">日文</option>
      <option value="ko">韩文</option>
      <option value="fr">法文</option>
      <option value="de">德文</option>
      <option value="es">西文</option>
      <option value="ru">俄文</option>
    </select>
  </header>

  <main>
    <textarea id="input" placeholder="输入或粘贴要翻译的文字…&#10;快捷键：Ctrl/⌘ + Enter 翻译"></textarea>
    <div class="row">
      <button id="go" class="primary">翻译</button>
      <button id="copy" class="ghost" disabled>复制</button>
    </div>

    <section id="result" class="hidden">
      <div class="meta"><span id="langs"></span><span id="ms"></span></div>
      <div id="out"></div>
    </section>

    <section id="tips" class="tips">
      网页里选中文字，会出现「译」小按钮；也可以右键 → 离线翻译。
    </section>

    <section id="setup" class="setup hidden">
      <p id="setupText">还没有可用的翻译模型。</p>
      <button id="install" class="primary small">下载 英文 ⇄ 中文 模型</button>
      <p class="hint">首次下载需要联网，之后完全离线。</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
